name: security_otlp
version: 0
status: draft
lib: charmlibs.interfaces.security_otlp
summary: Send a charm's security-relevant logs to a collector over OTLP with TLS.
description: |
  The `security_otlp` interface lets a workload charm send security-relevant logs to a collector
  over OTLP, separately from its general logging and `otlp` integrations. It is modeled on the
  `otlp` interface's Provider/Requirer split, but is logs-only, requires TLS from the first release,
  and is designed for cross-model, cross-controller, and cross-cloud relations.

providers:
  - name: log-aggregator-k8s-operator
    url: https://github.com/canonical/log-aggregator-k8s-operator

requirers:
  - name: hydra-operator
    url: https://github.com/canonical/hydra-operator
  - name: kratos-operator
    url: https://github.com/canonical/kratos-operator

maintainer: secops
