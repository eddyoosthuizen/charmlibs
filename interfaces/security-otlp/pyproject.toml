[project]
name = "charmlibs-interfaces-security-otlp"
description = "The charmlibs.interfaces.security_otlp package."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name="SecOps"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Development Status :: 3 - Alpha",
]
dynamic = ["version"]
dependencies = [
    # "ops",
    "pydantic~=2.0",
]

[dependency-groups]
lint = [  # installed for `just lint security-otlp` (unit, functional, and integration are also installed)
]
unit = [  # installed for `just unit security-otlp`
    "ops[testing]",
    "pytest",
]
functional = [  # installed for `just functional security-otlp`
]
integration = [  # installed for `just integration security-otlp`
    "jubilant",
]

[project.urls]
"Documentation" = "https://canonical.com/juju/docs/charmlibs/reference/charmlibs/interfaces/security_otlp"
"Repository" = "https://github.com/canonical/charmlibs/tree/main/interfaces/security-otlp"
"Issues" = "https://github.com/canonical/charmlibs/issues"
"Changelog" = "https://github.com/canonical/charmlibs/blob/main/interfaces/security-otlp/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charmlibs"]

[tool.hatch.version]
path = "src/charmlibs/interfaces/security_otlp/_version.py"

[tool.ruff]
extend = "../../pyproject.toml"
src = ["src", "tests/unit", "tests/functional", "tests/integration"]  # correctly sort local imports in tests

[tool.ruff.lint.extend-per-file-ignores]
# add additional per-file-ignores here to avoid overriding repo-level config
"tests/**/*" = [
]

[tool.pyright]
extends = "../../pyproject.toml"
include = ["src", "tests"]
pythonVersion = "3.10"  # check no python > 3.10 features are used

[tool.charmlibs.functional]
ubuntu = []  # ubuntu versions to run functional tests with, e.g. "24.04" (defaults to just "latest")
pebble = []  # pebble versions to run functional tests with, e.g. "v1.0.0", "master" (defaults to no pebble versions)
sudo = false  # whether to run functional tests with sudo (defaults to false)

[tool.charmlibs.integration]
# tags to run integration tests with (defaults to running once with no tag, i.e. tags = [''])
tags = []
