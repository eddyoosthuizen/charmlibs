name: log_filters
version: 0
status: draft
lib: charmlibs.interfaces.log_filters
summary: Publish the rules for filtering a charm's logs to the collector that applies them.
description: |
  The `log_filters` interface lets a charm own the rules for filtering its own logs, while the
  collector it sends them to applies those rules before forwarding anything. It carries rules and
  the charm's Juju topology only; the logs travel over any other relation, and the collector
  matches rules to logs by topology.

providers:
  - name: log-aggregator-k8s-operator
    url: https://github.com/canonical/log-aggregator-k8s-operator

requirers:
  - name: hydra-operator
    url: https://github.com/canonical/hydra-operator
  - name: kratos-operator
    url: https://github.com/canonical/kratos-operator

maintainer: secops
